<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F0C09" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <title>Barrakinha — O mapa da comida de rua do seu bairro.</title>
    <meta
      name="description"
      content="Ache as barracas de comida de rua abertas perto de você, peça pelo app e retire pronto. Sem fila, sem troco, sem mensalidade pro vendedor."
    />

    <!-- Endereço canônico. Sem ele, o mesmo conteúdo servido em
         barrakinha.com.br, www.barrakinha.com.br e no domínio de
         pré-visualização da Vercel conta como três páginas iguais, e o
         buscador escolhe sozinho qual mostrar. -->
    <link rel="canonical" href="https://barrakinha.com.br/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Barrakinha" />
    <meta property="og:url" content="https://barrakinha.com.br/" />
    <meta property="og:title" content="Barrakinha — O mapa da comida de rua do seu bairro." />
    <meta
      property="og:description"
      content="Ache as barracas de comida de rua abertas perto de você, peça pelo app e retire pronto."
    />
    <!-- A imagem do compartilhamento precisa de URL ABSOLUTA: quem lê
         essa tag (WhatsApp, Instagram, Twitter) não está no site e não
         tem como resolver um caminho relativo. Largura e altura
         declaradas fazem o cartão já nascer no tamanho certo, sem o
         pulo de layout enquanto a imagem carrega. -->
    <meta property="og:image" content="https://barrakinha.com.br/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Barrakinha — O mapa da comida de rua do seu bairro. Ao lado, a tela do app mostrando o mapa de barracas abertas por perto."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <!-- Atribui o cartão à conta: quando alguém posta o link no X, o
         card mostra de quem é o site. Só faz sentido existindo conta. -->
    <meta name="twitter:site" content="@barrakinha_app" />
    <meta name="twitter:title" content="Barrakinha — O mapa da comida de rua do seu bairro." />
    <meta
      name="twitter:description"
      content="Ache as barracas de comida de rua abertas perto de você, peça pelo app e retire pronto."
    />
    <meta name="twitter:image" content="https://barrakinha.com.br/og.png" />

    <!--
      Dados estruturados. Descrevem só o que existe hoje: uma
      organização e o site dela. Nada de `SoftwareApplication` nem de
      nota de avaliação — o app ainda não foi lançado, e declarar
      produto ou estrela que não existe é o tipo de coisa que rende
      penalidade manual, não resultado enriquecido.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://barrakinha.com.br/#org",
            "name": "Barrakinha",
            "url": "https://barrakinha.com.br/",
            "logo": "https://barrakinha.com.br/icon.png",
            "email": "contato@barrakinha.com",
            "description": "O mapa da comida de rua do seu bairro.",
            "sameAs": [
              "https://www.instagram.com/barrakinha.app/",
              "https://x.com/barrakinha_app"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://barrakinha.com.br/#site",
            "url": "https://barrakinha.com.br/",
            "name": "Barrakinha",
            "inLanguage": "pt-BR",
            "publisher": { "@id": "https://barrakinha.com.br/#org" }
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
